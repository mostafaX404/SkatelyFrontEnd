<header class="border-b border-gray-200 w-full shadow-sm fixed top-0 z-50 bg-white/95 backdrop-blur-sm">
  <div class="page-container flex items-center justify-between h-20">
    <img routerLink="/" src="/images/logo.png" alt="app logo" class="h-14 cursor-pointer hover:opacity-90 transition-opacity">

    <nav class="hidden md:flex gap-6 uppercase text-sm font-medium tracking-wide">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
      <a routerLink="/shop" routerLinkActive="active">Shop</a>
      <a routerLink="/test-error" routerLinkActive="active">Test Error</a>
      <a *appIsAdmin routerLink="/admin" routerLinkActive="active">Admin</a>
    </nav>

    <div class="flex items-center gap-2 sm:gap-3">
      <a
        matBadge="{{cartService.itemCount()}}"
        matBadgeSize="large"
        matBadgeColor="accent"
        routerLink="/cart"
        routerLinkActive="active"
        class="cart-link p-2 rounded-lg hover:bg-success-light transition-colors">
        <mat-icon class="text-gray-700">shopping_cart</mat-icon>
      </a>
      @if (accountService.currentUser()) {
        <button mat-button [mat-menu-trigger-for]="menu" class="!px-2">
          <mat-icon>arrow_drop_down</mat-icon>
          <span class="hidden sm:inline max-w-[160px] truncate">{{accountService.currentUser()?.email}}</span>
        </button>
      } @else {
        <button routerLink="/account/login" mat-stroked-button>Login</button>
        <button routerLink="/account/register" mat-flat-button>Register</button>
      }
    </div>
  </div>
</header>

@if (busyService.loading) {
  <mat-progress-bar mode="indeterminate" class="fixed top-20 z-50"></mat-progress-bar>
}

<mat-menu #menu="matMenu">
  <button mat-menu-item class="px-3" routerLink="/cart">
    <mat-icon>shopping_cart</mat-icon>
    <span>My cart</span>
  </button>
  <button mat-menu-item class="px-3" routerLink="/orders">
    <mat-icon>history</mat-icon>
    <span>My orders</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item class="px-3" (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
