<div class="page-container">
  <h2 class="font-semibold text-2xl mb-6 text-gray-900">My orders</h2>
  <div class="card overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200 cursor-pointer">
      <thead class="bg-gray-50">
        <tr class="uppercase text-gray-500 text-xs tracking-wider">
          <th class="text-left px-6 py-4">Order</th>
          <th class="text-left px-6 py-4">Date</th>
          <th class="text-left px-6 py-4">Total</th>
          <th class="text-left px-6 py-4">Status</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-100">
        @for (order of orders; track order.id) {
          <tr routerLink="/orders/{{order.id}}" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 font-medium text-gray-900">#{{order.id}}</td>
            <td class="px-6 py-4 text-gray-600">{{order.orderDate | date: 'medium'}}</td>
            <td class="px-6 py-4 text-gray-900">{{order.total | currency}}</td>
            <td class="px-6 py-4">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary/10 text-primary">
                {{order.status}}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
