<div class="card card-body">

  <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6">

    <a routerLink="/shop/{{item().productId}}" class="shrink-0">

      <img src="{{item().pictureUrl}}" alt="product image" class="h-24 w-24 object-cover rounded-lg border border-gray-100">

    </a>



    <div class="flex-1 min-w-0 space-y-2">

      <a routerLink="/shop/{{item().productId}}" class="font-medium text-gray-900 hover:text-primary transition-colors line-clamp-2">

        {{item().productName}}

      </a>



      <button mat-button (click)="removeItemFromCart()" class="btn-danger !px-2 !min-w-0">

        <mat-icon>delete_outline</mat-icon>

        Remove

      </button>

    </div>



    <div class="qty-control sm:mx-2">

      <button

        mat-icon-button

        class="btn-qty-minus"

        (click)="decrementQuantity()"

        aria-label="Decrease quantity">

        <mat-icon>remove</mat-icon>

      </button>

      <span class="qty-display">{{item().quantity}}</span>

      <button

        mat-icon-button

        class="btn-qty-plus"

        (click)="incrementQuantity()"

        aria-label="Increase quantity">

        <mat-icon>add</mat-icon>

      </button>

    </div>



    <div class="text-end sm:w-28 shrink-0">

      <p class="text-xs text-gray-500 uppercase tracking-wide">Line total</p>

      <p class="font-bold text-lg price-highlight">{{item().price | currency}}</p>

    </div>

  </div>

</div>
