@if (product) {
  <mat-card appearance="raised" routerLink="/shop/{{product.id}}" class="product-card h-full flex flex-col overflow-hidden !rounded-xl">
    <div class="aspect-square overflow-hidden bg-gray-50 relative">
      <img src="{{product.pictureUrl}}" alt="image of {{product.name}}" class="w-full h-full object-cover">
    </div>
    <mat-card-content class="!p-4 flex-1">
      <h2 class="text-sm font-semibold text-gray-900 line-clamp-2 mb-1">{{product.name}}</h2>
      <p class="price-highlight text-base">{{product.price | currency}}</p>
    </mat-card-content>
    <mat-card-actions class="!p-4 !pt-0" (click)="$event.stopPropagation()">
      <button mat-stroked-button class="w-full btn-success" (click)="cartService.addItemToCart(product)">
        <mat-icon>add_shopping_cart</mat-icon>
        Add to cart
      </button>
    </mat-card-actions>
  </mat-card>
}
