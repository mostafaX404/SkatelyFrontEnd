<mat-card class="max-w-md mx-auto card !shadow-card">
  <div class="card-body">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-semibold text-primary">Register</h1>
        <p class="text-gray-500 text-sm mt-2">Create an account to start shopping.</p>
      </div>

      <app-text-input label="First name" formControlName="firstName" />
      <app-text-input label="Last name" formControlName="lastName" />
      <app-text-input label="Email address" formControlName="email" />
      <app-text-input label="Password" formControlName="password" type="password" />

      @if (validationErrors) {
        <div class="mb-4 p-4 rounded-lg bg-red-50 border border-red-100 text-red-600 text-sm">
          <ul class="list-disc pl-5 space-y-1">
            @for (error of validationErrors; track $index) {
              <li>{{error}}</li>
            }
          </ul>
        </div>
      }

      <button mat-flat-button type="submit" class="w-full !py-6" [disabled]="!registerForm.valid">
        Register
      </button>
    </form>
  </div>
</mat-card>
