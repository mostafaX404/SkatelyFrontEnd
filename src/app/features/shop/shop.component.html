@if (Products) {
  <div class="page-container flex flex-col gap-6">
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
      <mat-paginator
        class="bg-white rounded-lg border border-gray-200"
        (page)="handlePageEvent($event)"
        [length]="Products.count"
        showFirstLastButtons="true"
        [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="shopParams.pageNumber - 1"
        aria-label="Select page">
      </mat-paginator>

      <form #searchForm="ngForm" (ngSubmit)="onSearchChange()"
        class="relative flex items-center w-full max-w-md">
        <input
          class="block w-full p-3.5 text-sm text-gray-900 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-shadow"
          type="search"
          placeholder="Search products..."
          name="search"
          [(ngModel)]="shopParams.search" />

        <button mat-icon-button type="submit" class="absolute right-1">
          <mat-icon>search</mat-icon>
        </button>
      </form>

      <div class="flex gap-3">
        <button class="march-input-height" mat-stroked-button (click)="openFilterDialog()">
          <mat-icon>filter_list</mat-icon>
          Filters
        </button>

        <button class="march-input-height" mat-stroked-button [matMenuTriggerFor]="sortMenu">
          <mat-icon>swap_vert</mat-icon>
          Sort
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-5">
      @for (prod of Products.data; track prod.id) {
        <app-product-item [product]="prod"></app-product-item>
      }
    </div>
  </div>

  <mat-menu #sortMenu="matMenu">
    <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
      @for (sort of sortOptions; track $index) {
        <mat-list-option [value]="sort.value" [selected]="shopParams.sort === sort.value">
          {{sort.name}}
        </mat-list-option>
      }
    </mat-selection-list>
  </mat-menu>
}
