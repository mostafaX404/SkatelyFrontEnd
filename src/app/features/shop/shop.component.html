@if (Products) {

<div class="flex flex-col gap-3">
    <div class="flex justify-between">

        <mat-paginator class="bg-white" (page)="handlePageEvent($event)" [length]="Products.value.count"
            showFirstLastButtons="true" [pageSizeOptions]="pageSizeOptions" [pageIndex]="shopParams.pageNumber -1"
            aria-label="Select page">

        </mat-paginator>

        <form #searchForm="ngForm" (ngSubmit)="onSearchChange()"
            class="relative flex items-center w-full max-w-md mx-4">
            <input class="block w-full p-4 text-sm text-gray-900 border border-gray-300 rounded-lg " type="search"
                placeholder="Search" name="search" [(ngModel)]="shopParams.search" />

            <button mat-icon-button type="submit" class="absolute inse-y-0 right-8 flex items-center pl-3">
                <mat-icon>search</mat-icon>
            </button>

        </form>



        <div class="flex gap-3">
            <button class="march-input-height" mat-stroked-button (click)="openFilterDialog()">
                <mat-icon>filter_list</mat-icon>
                Filters
            </button>

            <button class="march-input-height" mat-stroked-button [matMenuTriggerFor]="sortMenu">
                <mat-icon>swap_vert</mat-icon>
                Sort
            </button>
        </div>


    </div>

    <div class="grid grid-cols-5 gap-4">
        @for (prod of Products.value.data; track prod.id) {

        <app-product-item [product]="prod"></app-product-item>

        }
    </div>
</div>



<mat-menu #sortMenu="matMenu">

    <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
        @for (sort of sortOptions; track $index) {
        <mat-list-option [value]="sort.value" [selected]="shopParams.sort === sort.value">
            {{sort.name}}
        </mat-list-option>
        }
    </mat-selection-list>

</mat-menu>
}
