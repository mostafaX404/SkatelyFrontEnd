<div class="page-container flex flex-col lg:flex-row gap-6 mt-8 pb-12">
  <div class="w-full lg:w-3/4">
    <mat-stepper #stepper [linear]="true"
      (selectionChange)="onStepChange($event)"
      class="checkout-stepper card">
      <mat-step label="Address" [completed]="completionStatus().address">
        <div id="address-element" class="py-2"></div>

        <div class="flex justify-end mt-2">
          <mat-checkbox [checked]="saveAddress" (change)="onSaveAddressCheckboxChange($event)">
            Save as default address
          </mat-checkbox>
        </div>
        <div class="step-actions">
          <button routerLink="/shop" mat-stroked-button class="step-btn step-btn-outline">Continue shopping</button>
          <button matStepperNext mat-flat-button class="step-btn step-btn-primary" [disabled]="!completionStatus().address">Next</button>
        </div>
      </mat-step>

      <mat-step label="Shipping" [completed]="completionStatus().delivery">
        <app-checkout-delivary (deliveryComplete)="handleDeliveryChange($event)"></app-checkout-delivary>
        <div class="step-actions">
          <button matStepperPrevious mat-stroked-button class="step-btn step-btn-outline">Back</button>
          <button matStepperNext mat-flat-button class="step-btn step-btn-primary" [disabled]="!completionStatus().delivery">Next</button>
        </div>
      </mat-step>

      <mat-step label="Payment" [completed]="completionStatus().card">
        <div id="payment-element" class="py-2"></div>
        <div class="step-actions">
          <button matStepperPrevious mat-stroked-button class="step-btn step-btn-outline">Back</button>
          <button matStepperNext mat-flat-button class="step-btn step-btn-primary" [disabled]="!completionStatus().card">Next</button>
        </div>
      </mat-step>

      <mat-step label="Confirmation">
        <app-checkout-review [confirmationToken]="confirmationToken"></app-checkout-review>
        <div class="step-actions">
          <button matStepperPrevious mat-stroked-button class="step-btn step-btn-outline">Back</button>
          <button
            class="step-btn step-btn-primary step-btn-pay"
            [disabled]="!confirmationToken || loading"
            mat-flat-button
            (click)="confirmPayment(stepper)">
            @if (loading) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Pay {{ cartService.totals()?.total | currency }}
            }
          </button>
        </div>
      </mat-step>
    </mat-stepper>
  </div>
  <div class="w-full lg:w-1/4 lg:sticky lg:top-28 lg:self-start">
    <app-order-summary></app-order-summary>
  </div>
</div>
