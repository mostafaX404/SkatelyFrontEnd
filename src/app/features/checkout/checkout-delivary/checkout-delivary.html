<div class="w-full">
  <mat-radio-group
    [value]="cartService.selectedDelivery()?.id"
    (change)="updateDeliveryMethod($event.value)"
    class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    @for (method of checkoutService.deliveryMethods; track method.id) {
      <label
        class="delivery-option p-4 border border-gray-200 rounded-lg cursor-pointer w-full h-full hover:border-success-border hover:bg-success-light/50 transition-colors"
        [class.delivery-selected]="cartService.selectedDelivery() === method">
        <mat-radio-button
          class="w-full h-full"
          [checked]="cartService.selectedDelivery() === method"
          [value]="method">
          <div class="flex flex-col w-full h-full gap-1">
            <strong class="text-gray-900">{{method.shortName}} — {{method.price | currency}}</strong>
            <span class="text-sm text-gray-500">{{method.description}}</span>
          </div>
        </mat-radio-button>
      </label>
    }
  </mat-radio-group>
</div>
