@if (this.cartService.cart()?.items?.length! > 0) {
  <div class="page-container">
    <h1 class="text-2xl font-semibold text-gray-900 mb-6">Your Cart</h1>
    <div class="flex flex-col lg:flex-row w-full items-start gap-6">
      <div class="w-full lg:flex-1 space-y-4">
        @for (item of cartService.cart()?.items; track item.productId) {
          <app-cart-item [item]="item"></app-cart-item>
        }
      </div>
      <div class="w-full lg:w-80 lg:sticky lg:top-28 lg:self-start">
        <app-order-summary></app-order-summary>
      </div>
    </div>
  </div>
} @else {
  <app-empty-state></app-empty-state>
}
